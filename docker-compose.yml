# Local, $0 stack: backend API + Streamlit frontend.
#   docker compose up --build   ->   UI on :8501, API on :8000
# The api service reads Azure OpenAI creds from .env (copy .env.example -> .env).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      LLM_PROVIDER: azure
      # memory by default (portable); set SEARCH_PROVIDER=azure to use Azure AI Search
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-memory}
      AZURE_SEARCH_INDEX: contracts
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health').status_code==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
