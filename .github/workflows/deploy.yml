# Live deploy to Azure Container Apps. Manual only (costs money), and separate from
# the PR eval-gate. Requires these repo secrets:
#   AZURE_CREDENTIALS        service-principal JSON for azure/login
#   AZURE_SUBSCRIPTION_ID
#   AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY
# Terraform state should live in a remote backend (azurerm) for real use; see infra/.
name: deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm a live Azure deployment"
        required: true

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_openai_endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      TF_VAR_azure_openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
      TF_VAR_image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init & validate
        working-directory: infra
        run: |
          terraform init
          terraform validate

      # The container apps reference images in the registry, so create the registry
      # first, then build+push into it, then roll out the apps.
      - name: Create the registry
        working-directory: infra
        run: terraform apply -auto-approve -target=azurerm_container_registry.this

      - name: Build & push images (in ACR, no local Docker needed)
        run: |
          REG=$(terraform -chdir=infra output -raw acr_login_server)
          REG=${REG%%.*}
          az acr build --registry "$REG" --image "contract-intel-api:$IMAGE_TAG" --file Dockerfile.api .
          az acr build --registry "$REG" --image "contract-intel-frontend:$IMAGE_TAG" --file Dockerfile.frontend .

      - name: Terraform apply (roll out API + frontend)
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Show URLs
        working-directory: infra
        run: terraform output
